name: Banking Data Warehouse CI
on:
  push:
    paths:
      - 'projects/fintech/banking-data-warehouse-regulatory-reporting/**'
      - '.github/workflows/banking-data-warehouse-regulatory-reporting-ci.yml'
  pull_request:
    paths:
      - 'projects/fintech/banking-data-warehouse-regulatory-reporting/**'
      - '.github/workflows/banking-data-warehouse-regulatory-reporting-ci.yml'
  workflow_dispatch:
defaults:
  run:
    working-directory: projects/fintech/banking-data-warehouse-regulatory-reporting
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/fintech/banking-data-warehouse-regulatory-reporting/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
