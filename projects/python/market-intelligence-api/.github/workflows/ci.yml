name: Market Intelligence API CI

on:
  push:
    paths:
      - "projects/python/market-intelligence-api/**"
  pull_request:
    paths:
      - "projects/python/market-intelligence-api/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/python/market-intelligence-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/python/market-intelligence-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
