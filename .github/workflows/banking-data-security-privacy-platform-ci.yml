name: Banking Data Security and Privacy CI
on:
  push:
    paths:
      - 'projects/fintech/banking-data-security-privacy-platform/**'
      - '.github/workflows/banking-data-security-privacy-platform-ci.yml'
  pull_request:
    paths:
      - 'projects/fintech/banking-data-security-privacy-platform/**'
      - '.github/workflows/banking-data-security-privacy-platform-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fintech/banking-data-security-privacy-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
