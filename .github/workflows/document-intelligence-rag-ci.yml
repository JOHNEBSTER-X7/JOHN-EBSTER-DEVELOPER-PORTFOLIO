name: Document Intelligence RAG CI

on:
  push:
    branches: [main]
    paths:
      - "projects/ai/document-intelligence-rag/**"
      - ".github/workflows/document-intelligence-rag-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/ai/document-intelligence-rag/**"
      - ".github/workflows/document-intelligence-rag-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai/document-intelligence-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/ai/document-intelligence-rag/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
