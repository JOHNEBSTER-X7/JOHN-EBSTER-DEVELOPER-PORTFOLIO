name: Digital Asset Tokenisation CI

on:
  push:
    branches: [main]
    paths:
      - "projects/web3/digital-asset-tokenisation/**"
      - ".github/workflows/digital-asset-tokenisation-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/web3/digital-asset-tokenisation/**"
      - ".github/workflows/digital-asset-tokenisation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/web3/digital-asset-tokenisation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/web3/digital-asset-tokenisation/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Compile Solidity contracts
        run: npm run compile
      - name: Run contract and indexer tests
        run: npm test
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Build TypeScript
        run: npm run build
