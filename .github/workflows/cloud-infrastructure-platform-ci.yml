name: Cloud Infrastructure Platform CI

on:
  push:
    branches: [main]
    paths:
      - "projects/devops/cloud-infrastructure-platform/**"
      - ".github/workflows/cloud-infrastructure-platform-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/devops/cloud-infrastructure-platform/**"
      - ".github/workflows/cloud-infrastructure-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/devops/cloud-infrastructure-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/devops/cloud-infrastructure-platform/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
