name: Northstar AWS Deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: northstar-aws-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy to AWS ECS Fargate
    runs-on: ubuntu-latest
    environment: aws-production
    defaults:
      run:
        working-directory: projects/devops/cloud-infrastructure-platform/infra/aws
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Validate deployment prerequisites
        shell: bash
        run: |
          test -n "$AWS_REGION"
          test -n "$TF_STATE_BUCKET"
          aws sts get-caller-identity
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
      - name: Initialise remote Terraform state
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=northstar/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Validate Terraform configuration
        run: terraform validate
      - name: Create ECR repository
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.app
      - name: Authenticate Docker to ECR
        id: ecr
        shell: bash
        run: |
          REPOSITORY_URL="$(terraform output -raw ecr_repository_url)"
          REGISTRY="${REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          echo "repository_url=$REPOSITORY_URL" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image
        working-directory: projects/devops/cloud-infrastructure-platform
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.repository_url }}:${{ github.sha }}
        run: |
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
      - name: Provision infrastructure and deploy
        run: terraform apply -input=false -auto-approve -var="aws_region=$AWS_REGION" -var="desired_count=1" -var="image_tag=${GITHUB_SHA}"
      - name: Report application endpoint
        run: terraform output application_url
