name: Cross-Border Payments Settlement CI

on:
  push:
    branches: [main]
    paths:
      - "projects/fintech/cross-border-payments-settlement-platform/**"
      - ".github/workflows/cross-border-payments-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/fintech/cross-border-payments-settlement-platform/**"
      - ".github/workflows/cross-border-payments-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fintech/cross-border-payments-settlement-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
