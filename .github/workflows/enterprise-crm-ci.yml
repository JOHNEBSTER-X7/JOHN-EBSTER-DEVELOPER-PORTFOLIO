name: Enterprise CRM CI

on:
  push:
    paths:
      - "projects/full-stack/enterprise-crm/**"
      - ".github/workflows/enterprise-crm-ci.yml"
  pull_request:
    paths:
      - "projects/full-stack/enterprise-crm/**"
      - ".github/workflows/enterprise-crm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/enterprise_crm?schema=public"
    defaults:
      run:
        working-directory: projects/full-stack/enterprise-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
