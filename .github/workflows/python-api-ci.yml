name: Market Intelligence API CI

on:
  push:
    paths:
      - "projects/python/market-intelligence-api/**"
      - ".github/workflows/python-api-ci.yml"
  pull_request:
    paths:
      - "projects/python/market-intelligence-api/**"
      - ".github/workflows/python-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/python/market-intelligence-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
