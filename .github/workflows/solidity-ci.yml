name: Three-of-Five Multisig CI

on:
  push:
    paths:
      - "projects/web3/three-of-five-multisig/**"
      - ".github/workflows/solidity-ci.yml"
  pull_request:
    paths:
      - "projects/web3/three-of-five-multisig/**"
      - ".github/workflows/solidity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/web3/three-of-five-multisig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run compile
      - run: npm test
