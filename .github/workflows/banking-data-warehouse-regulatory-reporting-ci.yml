name: Banking Data Warehouse CI
on:
  push:
    paths:
      - 'projects/fintech/banking-data-warehouse-regulatory-reporting/**'
      - '.github/workflows/banking-data-warehouse-regulatory-reporting-ci.yml'
  pull_request:
    paths:
      - 'projects/fintech/banking-data-warehouse-regulatory-reporting/**'
      - '.github/workflows/banking-data-warehouse-regulatory-reporting-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fintech/banking-data-warehouse-regulatory-reporting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
