name: Banking Integration Gateway CI

on:
  push:
    branches: [main]
    paths:
      - "projects/fintech/banking-integration-gateway/**"
      - ".github/workflows/banking-integration-gateway-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/fintech/banking-integration-gateway/**"
      - ".github/workflows/banking-integration-gateway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fintech/banking-integration-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
