name: Markdown checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Markdown files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.md' -type f -print0 | while IFS= read -r -d '' file; do
            test -s "$file"
          done
